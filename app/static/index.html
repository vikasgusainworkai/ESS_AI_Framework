<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Management</title>
<style>
:root{--n:#10183A;--c:#00A7D8;--line:#DCE4EF;--bg:#F5F7FB;--mut:#64748B}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Segoe UI",Inter,Arial,sans-serif;background:var(--bg);color:#17233D}
header{background:var(--n);color:#fff;padding:14px 26px;display:flex;align-items:center;gap:14px}
header b{letter-spacing:.14em;font-size:15px} header i{font-style:normal;color:#7FE0F5}
main{max-width:900px;margin:26px auto;padding:0 20px}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar h2{margin:0;font-size:20px}
.add{width:42px;height:42px;border-radius:50%;border:0;background:var(--c);color:#fff;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 4px 12px #00a7d855}
.add:hover{background:#0090BA}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px #19345c14}
th{background:#E7EDF6;text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#52637A;padding:12px 16px}
td{padding:12px 16px;border-top:1px solid var(--line)}
td.act,th.act{text-align:right;white-space:nowrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font:inherit;cursor:pointer;margin-left:6px}
.btn.edit{color:#1769AA}.btn.edit:hover{background:#E8F0FE}
.btn.del{color:#B42318}.btn.del:hover{background:#FDE8E8}
.empty{padding:28px;text-align:center;color:var(--mut)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;color:#fff;display:none;font-weight:600;z-index:20}
.toast.err{background:#B42318}.toast.ok{background:#1FA463}
.modal{position:fixed;inset:0;background:#0F172A88;display:none;align-items:center;justify-content:center;z-index:10}
.modal.show{display:flex}
.dlg{background:#fff;border-radius:14px;padding:22px 24px;width:min(420px,92vw)}
.dlg h3{margin:0 0 14px}
.dlg label{display:block;font-size:12px;font-weight:700;color:#52637A;margin:10px 0 3px}
.dlg input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.dlg input[readonly]{background:#F1F4F9;color:var(--mut)}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.primary{background:var(--c);color:#fff;border:0;border-radius:8px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer}
.sec{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer}
</style></head><body>
<header><b>USER <i>MANAGEMENT</i></b><span style="color:#9FB6D4">ESS demo app</span></header>
<main>
  <div class="bar"><h2>Employees</h2><button class="add" id="add" title="Add user" aria-label="Add user">+</button></div>
  <table>
    <thead><tr><th>EMPID</th><th>Username</th><th>Designation</th><th class="act">Actions</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="dlg">
  <h3 id="title">Add user</h3>
  <label>EMPID</label><input id="f-empid" autocomplete="off">
  <label>Username</label><input id="f-username" autocomplete="off">
  <label>Designation</label><input id="f-designation" autocomplete="off">
  <div class="row"><button class="sec" id="cancel">Cancel</button><button class="primary" id="save">Save</button></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
let users=[],editing=null;
function toast(msg,kind){const t=$("toast");t.textContent=msg;t.className="toast "+kind;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",3200);}
async function call(method,url,body){
  const r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||("Request failed ("+r.status+")"));
  return data;
}
function render(){
  const tb=$("rows");tb.innerHTML="";
  if(!users.length){tb.innerHTML='<tr><td colspan="4" class="empty">No users yet - click + to add one.</td></tr>';return;}
  users.forEach(u=>{
    const tr=document.createElement("tr");
    [u.empid,u.username,u.designation].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td);});
    const td=document.createElement("td");td.className="act";
    td.innerHTML='<button class="btn edit">Edit</button><button class="btn del">Delete</button>';
    td.querySelector(".edit").onclick=()=>openDlg(u);
    td.querySelector(".del").onclick=()=>remove(u);
    tr.appendChild(td);tb.appendChild(tr);
  });
}
async function load(){try{users=await call("GET","/api/users");render();}catch(e){toast(e.message,"err");}}
function openDlg(u){
  editing=u?u.empid:null;
  $("title").textContent=u?"Edit user":"Add user";
  $("f-empid").value=u?u.empid:"";$("f-empid").readOnly=!!u;
  $("f-username").value=u?u.username:"";$("f-designation").value=u?u.designation:"";
  $("modal").classList.add("show");($(u?"f-username":"f-empid")).focus();
}
function closeDlg(){$("modal").classList.remove("show");}
async function save(){
  const body={empid:$("f-empid").value,username:$("f-username").value,designation:$("f-designation").value};
  try{
    if(editing===null){await call("POST","/api/users",body);toast("User added","ok");}
    else{await call("PUT","/api/users/"+encodeURIComponent(editing),body);toast("User updated","ok");}
    closeDlg();await load();
  }catch(e){toast(e.message,"err");}
}
async function remove(u){
  if(!confirm("Delete "+u.username+" ("+u.empid+")?"))return;
  try{await call("DELETE","/api/users/"+encodeURIComponent(u.empid));toast("User deleted","ok");await load();}
  catch(e){toast(e.message,"err");}
}
$("add").onclick=()=>openDlg(null);$("cancel").onclick=closeDlg;$("save").onclick=save;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDlg();});
load();
</script></body></html>
